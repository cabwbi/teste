<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teste de aceitação - Compatibilização</title>
  <style>
    body{margin:0;background:#f4f7fb;color:#12325b;font:15px Arial,sans-serif}.wrap{max-width:980px;margin:34px auto;padding:0 18px}h1{color:#00265f}.summary{padding:16px 18px;border-radius:12px;background:#00265f;color:#fff;font-weight:bold}.test{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:10px 0;padding:13px 15px;border:1px solid #dce5f0;border-radius:10px;background:#fff}.test i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-weight:bold}.ok i{background:#dff4e7;color:#16743b}.bad i{background:#fde4e2;color:#a1251d}.test strong{display:block}.test small{display:block;margin-top:4px;color:#64738a;line-height:1.4}a{color:#ffd200}.meta{margin-top:18px;color:#65738a;font-size:12px}
  </style>
</head>
<body><main class="wrap"><h1>Teste de aceitação — Compatibilização de créditos e processos</h1><div class="summary" id="summary">Executando verificações…</div><div id="results"></div><p class="meta" id="meta"></p></main>
<script src="compatibilizacao-data.js?v=20260909-3"></script>
<script src="compatibilizacao-engine.js?v=20260915-4"></script>
<script>
(async function(){
  const tests=[];const add=(name,ok,detail)=>tests.push({name,ok:Boolean(ok),detail});
  try{
    const D=window.CABW_COMPAT_DATA,E=window.CABW_COMPAT_ENGINE,tol=.01;
    add('Dados e mecanismo carregados',D&&E,`${(D.creditos||[]).length} dígitos e ${(D.requisicoes||[]).length} requisições elegíveis`);
    const all=E.analyze(D,{},{});
    add('Saldo integralmente reconciliado',Math.abs(all.summary.creditoDisponivel-D.summary.saldoDisponivel)<tol,`Crédito analisado: US$ ${all.summary.creditoDisponivel.toLocaleString('pt-BR',{minimumFractionDigits:2})}`);
    add('Empenho potencial limitado ao crédito e a mapas válidos',all.summary.potencialEmpenho<=all.summary.creditoDisponivel+tol&&all.allocation.plans.filter(p=>p.stage!=='revalidacao').every(p=>p.validadeMapa==='valido'),`Potencial financiável: US$ ${all.summary.potencialEmpenho.toLocaleString('pt-BR',{minimumFractionDigits:2})}`);
    add('Planos cobrem requisições integralmente',all.allocation.plans.every(p=>Math.abs(p.valorUsd-p.sources.reduce((s,x)=>s+x.valor,0))<tol),`${all.allocation.plans.length} requisições integralmente cobertas`);
    const immediate=all.allocation.plans.filter(p=>p.stage==='imediato');add('Empenhos imediatos identificam os dígitos aplicáveis',immediate.every(p=>p.sources.length&&p.sources.every(s=>s.digito&&s.valor>0))&&Math.abs(immediate.reduce((sum,p)=>sum+p.sources.reduce((subtotal,s)=>subtotal+s.valor,0),0)-all.summary.empenhoImediato)<tol,`${immediate.length} requisições reconciliadas por dígito`);
    const used=new Map();all.allocation.plans.forEach(p=>p.sources.forEach(s=>used.set(s.digito,(used.get(s.digito)||0)+s.valor)));const available=new Map(D.creditos.map(c=>[c.digito,Number(c.saldo||0)]));
    add('Nenhum dígito foi sobrealocado',[...used].every(([d,v])=>v<=(available.get(d)||0)+tol),`${used.size} dígitos utilizados nos cenários`);
    add('Ação orçamentária preservada por requisição',all.allocation.plans.every(p=>new Set(p.sources.map(s=>s.acao)).size===1),'Nenhuma requisição combina ações distintas');
    add('Realocação entre projetos preserva o PI',all.allocation.plans.filter(p=>p.stage.startsWith('projeto')).every(p=>new Set(p.sources.map(s=>s.planoInterno)).size===1),'Cenários válidos e vencidos entre projetos mantêm ação e Plano Interno');
    const adjusted=all.allocation.plans.filter(p=>p.stage==='projeto'||p.stage==='pi'||p.stage==='projeto_vencido'||p.stage==='pi_vencido');add('Realocações identificam dígitos de origem e destino',adjusted.every(p=>p.transfers?.length&&p.transfers.every(t=>t.origemDigito&&t.destinoDigitos?.length)),`${adjusted.length} propostas com rota de dígitos explícita`);
    const sameNature=all.allocation.plans.every(p=>p.status.toUpperCase().startsWith('M-')&&p.sources.every(s=>s.natureza===p.natureza&&D.creditos.some(c=>c.digito===s.digito&&c.omCodigos.includes(p.omCodigo)&&c.acao===s.acao&&c.planoInterno===s.planoInterno&&c.natureza===p.natureza))&&(p.transfers||[]).every(t=>t.natureza===p.natureza&&(t.destinoDigitos||[]).every(d=>D.creditos.some(c=>c.digito===d&&c.omCodigos.includes(p.omCodigo)&&c.acao===t.origemAcao&&c.projetos.includes(p.projeto)&&c.natureza===p.natureza&&(!p.stage.startsWith('projeto')||c.planoInterno===t.origemPi)))));
    const stageCounts=['imediato','revalidacao','projeto','pi','projeto_vencido','pi_vencido'].map(stage=>`${stage}: ${all.allocation.plans.filter(p=>p.stage===stage).length}`).join(' · ');
    add('Mesma natureza em todos os estágios',sameNature,`${stageCounts}; origens e destinos reconciliados ao catálogo`);
    const creditComposite=all.creditByOmNatureza.reduce((sum,row)=>sum+row.valor,0);const demandComposite=all.demandByOmNaturezaStatus.reduce((sum,row)=>sum+Object.values(row.values).reduce((subtotal,value)=>subtotal+value,0),0);
    add('Crédito consolidado por OM e natureza',Math.abs(creditComposite-all.summary.creditoDisponivel)<tol&&all.creditByOmNatureza.every(row=>row.key===E.omNaturezaKey(row.omCodigo,row.natureza)),`${all.creditByOmNatureza.length} categorias reconciliadas`);
    add('Requisições consolidadas por OM e natureza',Math.abs(demandComposite-all.summary.demandaCompativel)<tol&&all.demandByOmNaturezaStatus.every(row=>row.key===E.omNaturezaKey(row.omCodigo,row.natureza)),`${all.demandByOmNaturezaStatus.length} categorias reconciliadas`);
    add('Escopo anterior ao empenho',D.requisicoes.every(r=>['I-','P-','C-','G-','M-'].some(prefix=>r.status.toUpperCase().startsWith(prefix))&&r.valorUsd>0),'Somente requisições com valor positivo nas cinco situações previstas');
    const ls=E.analyze(D,{om:['LS']},{om:['LS']});add('Filtro simultâneo de OM',ls.creditByOmNatureza.every(r=>r.omCodigo==='LS')&&ls.requests.every(r=>r.omCodigo==='LS')&&ls.summary.creditoDisponivel<all.summary.creditoDisponivel,'A seleção de OM altera crédito, requisições e potencial');
    const a=E.analyze(D,{acao:['2048']},{}),b=E.analyze(D,{acao:['20XV']},{});add('Filtro de ação orçamentária',Math.abs(a.summary.creditoDisponivel-b.summary.creditoDisponivel)>tol,'Ações distintas retornam saldos e análises distintas');
    const pageText=await fetch('compatibilizacao.html',{cache:'no-store'}).then(r=>r.text());const page=new DOMParser().parseFromString(pageText,'text/html');
    add('Painel contém todos os filtros',page.querySelectorAll('section[aria-labelledby="creditFiltersTitle"] select').length===7&&page.querySelectorAll('section[aria-labelledby="requestFiltersTitle"] select').length===7&&page.querySelector('#filterReqStatus')&&page.querySelector('#filterReqValidade')&&page.querySelector('#filterReqAno')&&page.querySelector('#filterReqText'),'7 filtros de crédito e 8 filtros de requisições');
    const reference=String(D.meta.geradoEm||'').slice(0,10),approved=D.requisicoes.filter(r=>E.statusPrefix(r.status)==='M-'),valid=E.filterRequisitions(D.requisicoes,{validadeMapa:['valido'],dataReferencia:reference}),expired=E.filterRequisitions(D.requisicoes,{validadeMapa:['vencido'],dataReferencia:reference});
    add('Validade do mapa respeita 60 dias',valid.length+expired.length===approved.filter(r=>E.mapValidity(r,reference)).length&&valid.every(r=>E.mapValidity(r,reference)==='valido')&&expired.every(r=>E.mapValidity(r,reference)==='vencido'),`${valid.length} válidos e ${expired.length} vencidos na data de referência`);
    const currentYear=String(D.meta.geradoEm||'').slice(0,4),currentYearRows=E.filterRequisitions(D.requisicoes,{anoCertame:[currentYear]});add('Filtro de ano usa a data de abertura',currentYearRows.length>0&&currentYearRows.every(r=>String(r.dataAbertura||'').slice(0,4)===currentYear),'Ano do certame reconciliado com DT ABERTURA');
    const ready=valid.reduce((sum,r)=>sum+Number(r.valorUsd||0),0);add('KPI pronto para empenho usa mapas válidos',Math.abs(all.summary.valorProntoEmpenho-ready)<tol&&page.querySelector('#kpiCompatReady'),'Soma independente da cobertura de crédito e limitada aos mapas aprovados válidos');
    add('Relatório possui filtros simultâneos',page.querySelector('#reportOm')&&page.querySelector('#reportAcao')&&page.querySelector('#generateCompatReport'),'OM requisitante + ação orçamentária + geração de relatório');
    const panelText=await fetch('compatibilizacao-panel.js',{cache:'no-store'}).then(r=>r.text());
    add('Filtros compartilhados restringem os dois lados',panelText.includes('harmonizeFilters(creditFilters(),requestFilters())')&&panelText.includes("['om','natureza','projeto']"),'OM, natureza e projeto são sincronizados antes da análise de crédito e requisições');
    add('Consulta em lote dos filtros',page.querySelector('#applyCompatFilters')&&page.querySelector('#resetCompatFilters')?.textContent.includes('Limpar seleções')&&panelText.includes("addEventListener('change',markFiltersDirty)")&&!panelText.includes("addEventListener('change',render)"),'É possível marcar várias opções antes de clicar em Consultar');
    add('Pesquisa progressiva nas listas',panelText.includes('Filtrar opções a partir de 1 caractere')&&panelText.includes("search&&search.addEventListener('input'")&&panelText.includes('compactQuery')&&panelText.includes('Marcar visíveis'),'As opções são refinadas desde o primeiro caractere, inclusive sem hífens ou espaços');
    add('Escala monetária compartilhada por padrão',page.querySelector('#compareCompatScale')?.checked&&panelText.includes('scaleToggle.checked=true')&&panelText.includes('creditMax=comparable?series.sharedMax')&&panelText.includes('demandMax=comparable?series.sharedMax'),'Os dois gráficos usam o mesmo máximo dos totais, recalculado após cada consulta');
    add('Barras possuem geometria vertical idêntica',panelText.includes('autoexpand:false')&&panelText.includes("domain:[0,1],categoryorder:'array'")&&panelText.includes('automargin:false')&&panelText.includes('reversedKeys,reversedLabels')&&panelText.includes("const height=Math.max(exportMode?520:430"),'Margens, altura, domínio e ordem categórica são compartilhados');
    add('OM e natureza usam chaves categóricas únicas',panelText.includes('segments.map(row=>row.key)')&&panelText.includes("tickmode:'array'")&&panelText.includes('tickvals:(categoryKeys||[])'),'O detalhamento altera os segmentos, nunca as linhas OM + ND');
    add('Demanda total identificada nas barras',panelText.includes('totalAnnotations')&&panelText.includes('Total ${money(value)}'),'Cada barra empilhada informa também o total das requisições da categoria');
    add('Detalhamento interativo preserva o alinhamento',page.querySelectorAll('[data-credit-detail]').length===3&&page.querySelectorAll('[data-request-detail]').length===2&&panelText.includes("const chartModes={credit:'total',request:'status'}")&&panelText.includes('placeSegments'),'Crédito: consolidado/projeto/ação; requisições: situação/projeto; eixo permanece OM + ND');
    add('Barras consolidadas por categoria',panelText.includes('aggregateSegments')&&panelText.includes("row.key+'\\u0000'+row.detail")&&!page.querySelector('#addReqTerm'),'Cada combinação OM + ND contém somente os segmentos agregados de situação, projeto ou ação; o botão de mais foi removido');
    add('Tooltips analíticas e compactas',panelText.includes('<b>Ação · Dígito · Saldo:</b>')&&panelText.includes('Validade do mapa:</b>')&&panelText.includes("text.slice(0,30)+'...'"),'O detalhamento inclui a validade do mapa e limita a descrição a 30 caracteres');
    add('Relatório possui quatro áreas operacionais',page.querySelectorAll('.compat-plan-grid .compat-plan').length===4&&page.querySelector('#tableValidAdjustment')&&page.querySelector('#tableInvalidAdjustment')&&panelText.includes("reportArea('Mapas válidos mediante ajuste de Projeto e/ou PI'")&&panelText.includes("reportArea('Mapas não válidos mediante ajuste de Projeto e/ou PI'"),'As duas tabelas inferiores são separadas pela validade do mapa');
    add('Relatório identifica validade, requisições e dígitos',panelText.includes('immediateReportRows')&&panelText.includes('adjustmentReportRows')&&panelText.includes('Dígito aplicável')&&panelText.includes('Dígito origem → destino sugerido')&&panelText.includes('Validade do mapa')&&panelText.includes('reportRequestList'),'As quatro áreas mantêm rastreabilidade por requisição, dígito e validade');
    add('Consumo potencial por dígito no empenho imediato',pageText.includes('Dígito(s) aplicável(is) / parcela')&&pageText.includes('Valor potencialmente consumido')&&pageText.includes('Total potencialmente consumido')&&panelText.includes('immediateDigitRows')&&panelText.includes('Valor potencialmente consumido'),'Lista analítica e relatório detalham o consumo dos dígitos');
    const cssText=await fetch('compatibilizacao.css',{cache:'no-store'}).then(r=>r.text());
    add('Texto do relatório com contraste branco',cssText.includes('body.compat-page .compat-report>p')&&cssText.includes('body.compat-page .compat-report>h2')&&cssText.includes('color:#fff'),'Título e descrição vencem a regra global e permanecem brancos sobre o fundo azul');
    add('Conteúdo superior com contraste branco',cssText.includes('body.compat-page .compat-hero h1')&&cssText.includes('body.compat-page .compat-hero p')&&cssText.includes('body.compat-page .compat-hero .compat-meta')&&cssText.includes('.compat-back{')&&cssText.includes('color:#fff!important'),'Título, descrição, data e retorno permanecem brancos sobre o hero');
    const indexText=await fetch('index.html',{cache:'no-store'}).then(r=>r.text());const index=new DOMParser().parseFromString(indexText,'text/html');const cards=[...index.querySelectorAll('.home-card')];
    add('Card posicionado ao lado de Crédito Disponível',cards[0]?.getAttribute('href')==='credito.html'&&cards[1]?.getAttribute('href')==='compatibilizacao.html','O novo card ocupa a segunda posição da grade inicial');
    const financeCard=cards.find(card=>card.querySelector('h2')?.textContent.trim()==='Indicadores Financeiros');const financeMenu=index.querySelector('a.nav-link[href="https://camaraajcv.github.io/cabw-pagamentos./"]');
    add('Finanças abre o painel externo em nova janela',financeCard?.getAttribute('target')==='_blank'&&financeCard?.getAttribute('rel')?.includes('noopener')&&financeMenu?.getAttribute('target')==='_blank'&&financeMenu?.textContent.includes('Finanças'),'Menu e card usam o endereço homologado, incluindo o ponto final');
    const status=await fetch('data-update-status.json',{cache:'no-store'}).then(r=>r.json());const payments=status.pagamentosResumo||{};
    add('Indicadores financeiros carregados',payments.ano>=2026&&payments.quantidadeNlPagamento>0&&payments.valorNlPagamentoUsd>0&&payments.empresasPagas>0&&financeCard?.querySelectorAll('[data-finance-metric]').length===3,`${payments.quantidadeNlPagamento||0} NL e ${payments.empresasPagas||0} empresas na atualização corrente`);
    const hubText=await fetch('credito-menu.html',{cache:'no-store'}).then(r=>r.text());const hub=new DOMParser().parseFromString(hubText,'text/html');
    add('Menu Crédito disponível abre a escolha de painéis',index.querySelector('a.nav-link[href="credito-menu.html"]')&&hub.querySelector('a.credit-hub__card[href="credito.html"]')&&hub.querySelector('a.credit-hub__card[href="compatibilizacao.html"]'),'Ambiente intermediário oferece a visão executiva e a compatibilização');
  }catch(error){add('Execução geral',false,error&&error.message?error.message:String(error));}
  const passed=tests.filter(t=>t.ok).length;document.getElementById('summary').textContent=`${passed} de ${tests.length} testes aprovados`;
  document.getElementById('results').innerHTML=tests.map(t=>`<article class="test ${t.ok?'ok':'bad'}"><i>${t.ok?'✓':'!'}</i><div><strong>${t.name}</strong><small>${t.detail||''}</small></div></article>`).join('');
  document.getElementById('meta').textContent='Dados atualizados em '+(window.CABW_COMPAT_DATA?.meta?.geradoEm||'data não informada')+'.';
})();
</script></body></html>
