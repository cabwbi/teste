name: SISCABW Teste - atualizar dados do Google Drive

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    # 07:00, 12:00, 15:00 e 21:00 America/New_York.
    # Pares UTC cobrem EDT/EST; a trava local escolhe o correto.
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'

permissions:
  contents: write
  issues: write
  deployments: read
  actions: read

concurrency:
  group: siscabw-teste-drive
  cancel-in-progress: false

jobs:
  atualizar_teste:
    if: >-
      github.repository == 'cabwbi/teste' &&
      (github.event_name != 'issues' || startsWith(github.event.issue.title, 'EXECUTAR ATUALIZACAO SISCABW TESTE'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DRIVE_INPUT_FOLDER_ID: '1OF-84Nnbfp0y9M-nPDDWQqeeYfjQma-c'
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout do ambiente de teste
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear execução fora de cabwbi/teste
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'cabwbi/teste'

      - name: Validar horário local do agendamento
        id: schedule_gate
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            echo "Execução não agendada: atualização liberada."
            exit 0
          fi
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          expr = os.environ.get("SCHEDULE_EXPR", "").strip()
          mapping = {
              "0 1 * * *": (1, 0), "0 2 * * *": (2, 0),
              "0 11 * * *": (11, 0), "0 12 * * *": (12, 0),
              "0 14 * * *": (14, 0), "0 15 * * *": (15, 0),
              "0 16 * * *": (16, 0), "0 17 * * *": (17, 0),
              "0 19 * * *": (19, 0), "0 20 * * *": (20, 0),
          }
          hour, minute = mapping.get(expr, (-1, -1))
          now_utc = datetime.now(timezone.utc)
          if hour < 0:
              allowed = False
              nominal_local = now_utc.astimezone(ZoneInfo("America/New_York"))
          else:
              nominal = now_utc.replace(hour=hour, minute=minute, second=0, microsecond=0)
              nominal_local = nominal.astimezone(ZoneInfo("America/New_York"))
              allowed = nominal_local.strftime("%H:%M") in {
                  "07:00", "12:00", "15:00", "21:00"
              }
          actual_local = now_utc.astimezone(ZoneInfo("America/New_York"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run_update={'true' if allowed else 'false'}\n")
              out.write(f"local_nominal={nominal_local.isoformat()}\n")
              out.write(f"local_actual={actual_local.isoformat()}\n")
          print(
              f"Agendamento UTC: {expr}; horário local nominal: {nominal_local.isoformat()}; "
              f"horário local real: {actual_local.isoformat()}; executar={allowed}"
          )
          PY

      - name: Configurar Python
        if: steps.schedule_gate.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        if: steps.schedule_gate.outputs.run_update == 'true'
        run: python -m pip install --disable-pip-version-check -r automation/requirements.txt

      - name: Preparar candidato a partir da versão publicada no teste
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/siscabw-inputs /tmp/siscabw-candidate /tmp/siscabw-artifacts
          mkdir -p /tmp/siscabw-inputs /tmp/siscabw-candidate /tmp/siscabw-artifacts
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='automation/'             ./ /tmp/siscabw-candidate/
          test -f /tmp/siscabw-candidate/index.html
          test -f /tmp/siscabw-candidate/credito.html
          test -f /tmp/siscabw-candidate/credit-panel.js
          grep -q 'generateAdidanciasReport' /tmp/siscabw-candidate/credit-panel.js
          grep -q 'generateAdidanciasReport' /tmp/siscabw-candidate/credito.html
          test -f automation/generate_data.py.gz.b64

      - name: Baixar fontes Excel do Google Drive
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/download_drive.py             --folder-id "$DRIVE_INPUT_FOLDER_ID"             --output /tmp/siscabw-inputs             | tee /tmp/siscabw-artifacts/download.log
          cp /tmp/siscabw-inputs/input_manifest.json /tmp/siscabw-artifacts/input_manifest.json

      - name: Verificar se os Excel realmente mudaram
        id: source_check
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/check_source_changes.py /tmp/siscabw-inputs/input_manifest.json .siscabw-source-fingerprint.json | tee /tmp/siscabw-artifacts/source-check.json
          if python -c 'import json; print(json.load(open("/tmp/siscabw-artifacts/source-check.json"))["changed"])' | grep -qx False; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fontes sem alteracoes; nao gerar nem publicar."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar gerador de dados
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 -d automation/generate_data.py.gz.b64 | gzip -d > /tmp/siscabw-generate.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/siscabw-generate.py')
          source = path.read_text(encoding='utf-8')
          if 'def safe_xldate(' not in source:
              target = 'xlrd.xldate.xldate_as_datetime(v,wb.datemode)'
              if target in source:
                  helper = "\n".join([
                      "def safe_xldate(v, datemode):",
                      "    try:",
                      "        return xlrd.xldate.xldate_as_datetime(v, datemode)",
                      "    except (OverflowError, ValueError):",
                      "        return v",
                  ])
                  source = source.replace(target, 'safe_xldate(v,wb.datemode)')
                  source = source.replace('import xlrd\n', 'import xlrd\n\n' + helper + '\n', 1)
                  path.write_text(source, encoding='utf-8')
                  print('Proteção aplicada para datas XLS inválidas.')
          PY
          python -m py_compile /tmp/siscabw-generate.py

      - name: Atualizar dados primarios do pacote de teste
        id: generate
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/siscabw-generate.py \
            --inputs /tmp/siscabw-inputs \
            --repo /tmp/siscabw-candidate \
            | tee /tmp/siscabw-artifacts/generation-report.json

      - name: Enriquecer credito e contratos
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/enrich_primary_data.py \
            --inputs /tmp/siscabw-inputs \
            --repo /tmp/siscabw-candidate \
            | tee /tmp/siscabw-artifacts/enrich-primary-report.json

      - name: Regenerar entrada processos e compatibilizacao
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/refresh_secondary_data.py \
            --inputs /tmp/siscabw-inputs \
            --repo /tmp/siscabw-candidate \
            | tee /tmp/siscabw-artifacts/secondary-generation-report.json

      - name: Validar origem dos Excel e sincronizar metadados
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/finalize_update.py /tmp/siscabw-candidate /tmp/siscabw-inputs/input_manifest.json

      - name: Preparar lista e downloads das fontes
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/siscabw-release-assets
          mkdir -p /tmp/siscabw-release-assets
          python automation/prepare_source_assets.py \
            --inputs /tmp/siscabw-inputs \
            --manifest /tmp/siscabw-inputs/input_manifest.json \
            --repo /tmp/siscabw-candidate \
            --assets /tmp/siscabw-release-assets \
            --release-tag siscabw-fontes-teste \
            --repo-full-name cabwbi/teste \
            | tee /tmp/siscabw-artifacts/source-assets-report.json

      - name: Validar dados e coerencia de todos os paineis
        id: validate
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          cur = Path.cwd()
          cand = Path('/tmp/siscabw-candidate')
          inputs = Path('/tmp/siscabw-inputs')
          assets = Path('/tmp/siscabw-release-assets')
          errors = []
          warnings = []
          prefixes = {
              'contracts-data.js': 'window.CABW_CONTRACTS_DATA = ',
              'credit-data.js': 'window.CABW_CREDIT_DATA = ',
              'compatibilizacao-data.js': 'window.CABW_COMPAT_DATA = ',
              'processos-data.js': 'window.CABW_PROCESSOS_DATA = ',
              'rp-data.js': 'window.CABW_RP_DATA = ',
              'suprimento-data.js': 'window.CABW_SUPRIMENTO_DATA = ',
              'home-data.js': 'window.CABW_HOME_DATA = ',
          }

          def j(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def js(root, name):
              t = (root / name).read_text(encoding='utf-8')
              p = prefixes[name]
              if not t.startswith(p) or not t.rstrip().endswith(';'):
                  raise ValueError(f'Formato invalido: {name}')
              return json.loads(t[len(p):].rstrip()[:-1])

          def close(a, b, tol=0.02):
              return abs(float(a or 0) - float(b or 0)) <= tol

          manifest = j(inputs / 'input_manifest.json')
          required = manifest.get('files', [])
          additional = manifest.get('ignoredExcelFiles', [])
          if len(required) != 10:
              errors.append(f'Esperadas 10 fontes obrigatorias; recebidas {len(required)}.')
          canonical = [x.get('canonicalName') for x in required]
          if len(canonical) != len(set(canonical)):
              errors.append('Fontes canonicas duplicadas no Drive.')

          source_manifest = j(cand / 'data-sources.json')
          if len(source_manifest.get('files', [])) != len(required) + len(additional):
              errors.append('Lista de fontes nao inclui todos os Excel baixados.')
          for item in source_manifest.get('files', []):
              for key in ('csvAsset', 'pdfAsset'):
                  p = assets / item.get(key, '')
                  if not p.is_file() or p.stat().st_size <= 0:
                      errors.append(f'Asset ausente ou vazio: {item.get(key)}.')
          zip_asset = assets / source_manifest.get('zipAsset', '')
          if not zip_asset.is_file() or zip_asset.stat().st_size <= 0:
              errors.append('ZIP consolidado das fontes ausente ou vazio.')

          summary = j(cand / 'contracts-summary.json')
          contracts_obj = js(cand, 'contracts-data.js')
          contracts = contracts_obj.get('contracts', contracts_obj.get('data', []))
          if summary['total'] != len(contracts):
              errors.append('Total de contratos diverge da lista.')
          if summary['total'] != sum(summary['counts'].values()):
              errors.append('Soma das categorias diverge do total de contratos.')
          required_contract_keys = {'liquidationDetailsByContract','occurrencesByContract','poDetails','invoiceMonthlyByContract'}
          missing_contract_keys = sorted(required_contract_keys - set(contracts_obj))
          if missing_contract_keys:
              errors.append(f'Estruturas de contratos ausentes: {missing_contract_keys}.')

          expected = {'administrativos': 0, 'finalisticos': 0, 'fms': 0}
          ids = []
          for item in contracts:
              cid = str(item.get('contrato', '')).strip()
              ids.append(cid)
              cage = str(item.get('cage', '')).strip()
              command = str(item.get('grandeComando', item.get('grandComando', ''))).strip()
              cat = 'fms' if cage == 'W2525' else ('administrativos' if command == 'CW' else 'finalisticos')
              expected[cat] += 1
              if item.get('categoria') != cat:
                  errors.append(f'Classificacao inconsistente no contrato {cid}.')
                  break
          if not all(ids) or len(ids) != len(set(ids)):
              errors.append('Ha contrato sem ID ou ID duplicado.')
          if expected != summary['counts']:
              errors.append(f'Categorias calculadas {expected} divergem de {summary["counts"]}.')

          credit = js(cand, 'credit-data.js')
          digits = credit.get('digits', [])
          pos = credit.get('pos', credit.get('purchaseOrders', []))
          signing = credit.get('signing', credit.get('signatureOrders', []))
          if pos and not all('liquidadoNlUsd' in x and 'empenhadoNaoLiquidadoUsd' in x for x in pos):
              errors.append('POs do credito sem campos de liquidacao.')
          if signing and not all('isAmend' in x and 'omLabels' in x for x in signing):
              errors.append('POs em assinatura sem enriquecimento de OM/aditamento.')
          available_digits = sum(float(x.get('saldo', 0) or 0) for x in digits)
          available_signing = sum(float(x.get('valorUsd', 0) or 0) for x in signing if not x.get('isAmend'))
          available = available_digits + available_signing
          committed = sum(float(x.get('valorUsd', 0) or 0) for x in pos)
          liquidated = sum(float(x.get('liquidadoNlUsd', 0) or 0) for x in pos)

          home = js(cand, 'home-data.js')
          hc = home.get('gestaoCredito', {})
          if not close(hc.get('creditoDisponivelUsd'), available):
              errors.append(f'Credito disponivel da entrada diverge do detalhe: {hc.get("creditoDisponivelUsd")} vs {available:.2f}.')
          if not close(hc.get('creditoEmpenhadoUsd'), committed):
              errors.append('Credito empenhado da entrada diverge das POs.')
          if not close(hc.get('creditoLiquidadoUsd'), liquidated):
              errors.append('Credito liquidado da entrada diverge das POs.')
          if home.get('contratos', {}).get('quantidade') != summary['total']:
              errors.append('Card de contratos da entrada diverge do resumo.')
          if home.get('contratos', {}).get('categorias') != summary['counts']:
              errors.append('Categorias do card de entrada divergem do resumo.')

          proc = js(cand, 'processos-data.js')
          ps = proc.get('summary', {})
          if ps.get('totalEscopo') != len(proc.get('materials', [])) + len(proc.get('repairs', [])):
              errors.append('Resumo de processos diverge das listas.')
          if home.get('requisicoes', {}).get('materiais', {}).get('quantidade') != ps.get('materiais2026', {}).get('requisicoes'):
              errors.append('Card de materiais da entrada diverge de processos-data.')
          if home.get('requisicoes', {}).get('reparos', {}).get('quantidade') != ps.get('reparos2026', {}).get('requisicoes'):
              errors.append('Card de reparos da entrada diverge de processos-data.')

          compat = js(cand, 'compatibilizacao-data.js')
          compat_saldo = float(compat.get('summary', {}).get('saldoDisponivel', 0) or 0)
          if not close(compat_saldo, available_digits):
              errors.append('Saldo da compatibilizacao diverge do saldo dos digitos.')
          if len(compat.get('creditos', [])) != len(digits):
              errors.append('Quantidade de creditos da compatibilizacao diverge de credit-data.')

          rp = js(cand, 'rp-data.js')
          if rp.get('summary', {}).get('totalRegistros') != len(rp.get('records', [])):
              errors.append('Resumo de RP diverge dos registros.')
          sf = js(cand, 'suprimento-data.js')
          if sf.get('summary', {}).get('totalOrders') != len(sf.get('orders', [])):
              errors.append('Resumo de suprimento diverge das ordens.')

          status = j(cand / 'data-update-status.json')
          if 'compatibilizacao' not in status.get('paineis', {}):
              errors.append('Status nao possui fontes da compatibilizacao.')
          if status.get('processosResumo') != ps:
              errors.append('Resumo de processos no status diverge de processos-data.')
          if status.get('pagamentosResumo') != home.get('financas'):
              errors.append('Resumo financeiro no status diverge de home-data.')

          gov = (cand / 'governanca.html').read_text(encoding='utf-8')
          if 'data-rp-current' not in gov or 'data-rp-count' not in gov or 'rp-data.js' not in gov:
              errors.append('Governanca ainda possui indicador de RP nao vinculado a rp-data.')
          sources_page = (cand / 'fontes-dados.html').read_text(encoding='utf-8')
          if 'data-sources.json' not in sources_page or 'Baixar todas as planilhas em ZIP' not in sources_page:
              errors.append('Pagina de fontes incompleta.')
          for page in ('index.html','credito-menu.html','contratos.html','processos.html','governanca.html','suprimento-fundos.html'):
              if 'fontes-dados.html' not in (cand / page).read_text(encoding='utf-8'):
                  errors.append(f'Link para fontes ausente em {page}.')

          metrics_after = {
              'contracts_total': int(summary['total']),
              'administrativos': int(summary['counts']['administrativos']),
              'finalisticos': int(summary['counts']['finalisticos']),
              'fms': int(summary['counts']['fms']),
              'processos': int(ps.get('totalEscopo', 0)),
              'rp': int(rp.get('summary', {}).get('totalRegistros', 0)),
              'sf': len(sf.get('orders', [])),
          }
          try:
              old_summary = j(cur / 'contracts-summary.json')
              old_proc = js(cur, 'processos-data.js')
              old_rp = js(cur, 'rp-data.js')
              old_sf = js(cur, 'suprimento-data.js')
              metrics_before = {
                  'contracts_total': int(old_summary['total']),
                  'administrativos': int(old_summary['counts']['administrativos']),
                  'finalisticos': int(old_summary['counts']['finalisticos']),
                  'fms': int(old_summary['counts']['fms']),
                  'processos': int(old_proc['summary']['totalEscopo']),
                  'rp': int(old_rp['summary']['totalRegistros']),
                  'sf': len(old_sf.get('orders', old_sf.get('records', []))),
              }
              limits = {
                  'contracts_total': (0.10, 0.25), 'administrativos': (0.25, 0.50),
                  'finalisticos': (0.20, 0.40), 'fms': (0.10, 0.20),
                  'processos': (0.15, 0.30), 'rp': (0.25, 0.35), 'sf': (0.25, 0.50),
              }
              for key, before in metrics_before.items():
                  after = metrics_after[key]
                  if before <= 0:
                      continue
                  max_drop, max_growth = limits[key]
                  if (before - after) / before > max_drop:
                      errors.append(f'Queda anormal em {key}: {before} -> {after}.')
                  if (after - before) / before > max_growth:
                      errors.append(f'Crescimento anormal em {key}: {before} -> {after}.')
          except Exception as exc:
              warnings.append(f'Comparacao com versao anterior nao executada: {exc}')
              metrics_before = {}

          for name in (
              'contracts-data.js','credit-data.js','compatibilizacao-data.js','processos-data.js',
              'rp-data.js','suprimento-data.js','home-data.js','credit-panel.js','contracts-panel.js',
              'processos-panel.js','rp-panel.js','suprimento-fundos.js','compatibilizacao-panel.js'
          ):
              result = subprocess.run(['node','--check',str(cand / name)],capture_output=True,text=True)
              if result.returncode:
                  errors.append(f'Sintaxe JavaScript invalida em {name}: {result.stderr.strip()}')

          mirrors = {
              'contracts-data.js':'assets/js/contracts-data.js',
              'credit-data.js':'assets/js/credit-data.js',
              'processos-data.js':'assets/js/processos-data.js',
              'rp-data.js':'assets/js/rp-data.js',
              'suprimento-data.js':'assets/js/suprimento-data.js',
              'contracts-summary.json':'assets/data/contracts-summary.json',
              'data-update-status.json':'assets/data/data-update-status.json',
              'data-sources.json':'assets/data/data-sources.json',
          }
          for source, mirror in mirrors.items():
              if not (cand / mirror).is_file() or (cand / source).read_bytes() != (cand / mirror).read_bytes():
                  errors.append(f'Espelho divergente: {source} / {mirror}.')

          report = {
              'status': 'ok' if not errors else 'failed',
              'errors': errors,
              'warnings': warnings,
              'requiredSources': len(required),
              'additionalSources': len(additional),
              'before': metrics_before,
              'after': metrics_after,
              'creditAvailable': round(available, 2),
              'creditLiquidated': round(liquidated, 2),
          }
          Path('/tmp/siscabw-artifacts/validation-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit(2)
          PY

      - name: Guardar diagnóstico
        if: always() && steps.schedule_gate.outputs.run_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: siscabw-teste-${{ github.run_number }}
          path: /tmp/siscabw-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Registrar assinatura das fontes validadas
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true' && success()
        shell: bash
        run: |
          cp /tmp/siscabw-artifacts/source-check.json /tmp/siscabw-candidate/.siscabw-source-fingerprint.json

      - name: Aplicar dados validados no ambiente de teste
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='automation/'             --exclude='auth.js'             /tmp/siscabw-candidate/ ./

      - name: Publicar no main de cabwbi/teste
        id: publish
        if: steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DATA_REF=$(python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data-update-status.json').read_text(encoding='utf-8'))
          print(d.get('geradoEm', 'sem-data'))
          PY
          )
          echo "data_ref=$DATA_REF" >> "$GITHUB_OUTPUT"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "result=no_change" >> "$GITHUB_OUTPUT"
            echo 'Nenhuma alteração encontrada: os dados eram os mesmos.'
            exit 0
          fi
          git add -A
          git commit -m "AUTO TESTE: atualiza dados SISCABW - $DATA_REF"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "result=updated" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publicar downloads das fontes na release estavel
        if: steps.publish.outputs.result == 'updated' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='siscabw-fontes-teste'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title 'Fontes de dados SISCABW TESTE' \
              --notes 'Assets atualizados automaticamente pelo workflow do ambiente de teste.'
          fi
          gh release upload "$TAG" /tmp/siscabw-release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Notificar deploy confirmado no GitHub Mobile
        if: always() && steps.schedule_gate.outputs.run_update == 'true' && steps.source_check.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
          DATA_REF: ${{ steps.publish.outputs.data_ref }}
        with:
          script: |
            const result = process.env.PUBLISH_RESULT || '';
            const sha = process.env.COMMIT_SHA || '';
            const dataRef = process.env.DATA_REF || 'não disponível';
            const owner = context.repo.owner, repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let confirmed = false, deployedAt = '';
            let deploymentId = null;
            let statusCheckError = '';
            if (result === 'updated' && sha) {
              for (let attempt = 0; attempt < 30; attempt++) {
                let deployments;
                try {
                  deployments = await github.rest.repos.listDeployments({
                    owner, repo, sha, environment: 'github-pages', per_page: 10
                  });
                } catch (err) {
                  statusCheckError = String(err.message || err);
                  break;
                }
                for (const dep of deployments.data) {
                  let statuses;
                  try {
                    statuses = await github.rest.repos.listDeploymentStatuses({
                      owner, repo, deployment_id: dep.id, per_page: 20
                    });
                  } catch (err) {
                    statusCheckError = String(err.message || err);
                    break;
                  }
                  const success = statuses.data.find(s => s.state === 'success');
                  if (success) {
                    confirmed = true;
                    deployedAt = success.created_at;
                    deploymentId = dep.id;
                    break;
                  }
                }
                if (confirmed || statusCheckError) break;
                await sleep(20000);
              }
            }
            let title, body;
            if (confirmed) {
              title = '[SISCABW TESTE] Deploy confirmado';
              body = `@cabwbi\n\n**Atualização publicada e confirmada no GitHub Pages.**\n\n**DEPLOY_CONFIRMED_AT_UTC:** ${deployedAt}\n**DEPLOYMENT_ID:** ${deploymentId}\n**DATA_REF:** ${dataRef}\n**COMMIT_SHA:** ${sha}\n**RUN_URL:** ${runUrl}\nPainel: https://cabwbi.github.io/teste/`;
            } else if (result === 'updated') {
              title = '[SISCABW TESTE] Deploy ainda não confirmado';
              body = `@cabwbi\n\n**Dados gravados no GitHub, mas o deploy Pages não foi confirmado.**\n\nCommit: ${sha}\nErro de consulta: ${statusCheckError || 'nenhum deploy success encontrado no prazo'}\nRun: ${runUrl}`;
            } else if (result === 'no_change') {
              title = '[SISCABW TESTE] Sem alteração de dados';
              body = `@cabwbi\n\nNenhuma alteração de dados publicada.\nRun: ${runUrl}`;
            } else {
              title = '[SISCABW TESTE] Falha na atualização';
              body = `@cabwbi\n\nO fluxo não concluiu a gravação dos dados.\nRun: ${runUrl}`;
            }
            if (context.eventName === 'issues' && context.issue.number) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body
              });
              await github.rest.issues.update({
                owner, repo, issue_number: context.issue.number,
                state: 'closed', state_reason: 'completed'
              });
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, assignees: ['cabwbi']
              });
              await github.rest.issues.update({
                owner, repo, issue_number: created.data.number,
                state: 'closed', state_reason: 'completed'
              });
            }
