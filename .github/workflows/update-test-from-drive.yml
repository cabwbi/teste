name: SISCABW Teste - atualizar dados do Google Drive

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    # Candidatos UTC para 04:00, 08:00, 12:00, 16:00 e 21:00
    # em America/New_York. A trava local elimina automaticamente o
    # candidato incorreto durante EDT/EST.
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'

permissions:
  contents: write
  issues: write
  deployments: read
  actions: read

concurrency:
  group: siscabw-teste-drive
  cancel-in-progress: false

jobs:
  atualizar_teste:
    if: >-
      github.repository == 'cabwbi/teste' &&
      (github.event_name != 'issues' || startsWith(github.event.issue.title, 'EXECUTAR ATUALIZACAO SISCABW TESTE'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRIVE_INPUT_FOLDER_ID: '1OF-84Nnbfp0y9M-nPDDWQqeeYfjQma-c'
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout do ambiente de teste
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear execução fora de cabwbi/teste
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'cabwbi/teste'

      - name: Validar horário local do agendamento
        id: schedule_gate
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            echo "Execução não agendada: atualização liberada."
            exit 0
          fi
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          expr = os.environ.get("SCHEDULE_EXPR", "").strip()
          mapping = {
              "0 1 * * *": (1, 0),
              "0 2 * * *": (2, 0),
              "0 8 * * *": (8, 0),
              "0 9 * * *": (9, 0),
              "0 12 * * *": (12, 0),
              "0 13 * * *": (13, 0),
              "0 16 * * *": (16, 0),
              "0 17 * * *": (17, 0),
              "0 20 * * *": (20, 0),
              "0 21 * * *": (21, 0),
          }
          hour, minute = mapping.get(expr, (-1, -1))
          now_utc = datetime.now(timezone.utc)
          if hour < 0:
              allowed = False
              nominal_local = now_utc.astimezone(ZoneInfo("America/New_York"))
          else:
              nominal = now_utc.replace(hour=hour, minute=minute, second=0, microsecond=0)
              nominal_local = nominal.astimezone(ZoneInfo("America/New_York"))
              allowed = nominal_local.strftime("%H:%M") in {
                  "04:00", "08:00", "12:00", "16:00", "21:00"
              }
          actual_local = now_utc.astimezone(ZoneInfo("America/New_York"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run_update={'true' if allowed else 'false'}\n")
              out.write(f"local_nominal={nominal_local.isoformat()}\n")
              out.write(f"local_actual={actual_local.isoformat()}\n")
          print(
              f"Agendamento UTC: {expr}; horário local nominal: {nominal_local.isoformat()}; "
              f"horário local real: {actual_local.isoformat()}; executar={allowed}"
          )
          PY

      - name: Configurar Python
        if: steps.schedule_gate.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        if: steps.schedule_gate.outputs.run_update == 'true'
        run: python -m pip install --disable-pip-version-check -r automation/requirements.txt

      - name: Preparar candidato a partir da versão publicada no teste
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/siscabw-inputs /tmp/siscabw-candidate /tmp/siscabw-artifacts
          mkdir -p /tmp/siscabw-inputs /tmp/siscabw-candidate /tmp/siscabw-artifacts
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='automation/'             ./ /tmp/siscabw-candidate/
          test -f /tmp/siscabw-candidate/index.html
          test -f /tmp/siscabw-candidate/credito.html
          test -f /tmp/siscabw-candidate/credit-panel.js
          grep -q 'generateAdidanciasReport' /tmp/siscabw-candidate/credit-panel.js
          grep -q 'generateAdidanciasReport' /tmp/siscabw-candidate/credito.html
          test -f automation/generate_data.py.gz.b64

      - name: Baixar as dez fontes obrigatórias do Google Drive
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/download_drive.py             --folder-id "$DRIVE_INPUT_FOLDER_ID"             --output /tmp/siscabw-inputs             | tee /tmp/siscabw-artifacts/download.log
          cp /tmp/siscabw-inputs/input_manifest.json /tmp/siscabw-artifacts/input_manifest.json

      - name: Preparar gerador de dados
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 -d automation/generate_data.py.gz.b64 | gzip -d > /tmp/siscabw-generate.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/siscabw-generate.py')
          source = path.read_text(encoding='utf-8')
          if 'def safe_xldate(' not in source:
              target = 'xlrd.xldate.xldate_as_datetime(v,wb.datemode)'
              if target in source:
                  helper = "\n".join([
                      "def safe_xldate(v, datemode):",
                      "    try:",
                      "        return xlrd.xldate.xldate_as_datetime(v, datemode)",
                      "    except (OverflowError, ValueError):",
                      "        return v",
                  ])
                  source = source.replace(target, 'safe_xldate(v,wb.datemode)')
                  source = source.replace('import xlrd\n', 'import xlrd\n\n' + helper + '\n', 1)
                  path.write_text(source, encoding='utf-8')
                  print('Proteção aplicada para datas XLS inválidas.')
          PY
          python -m py_compile /tmp/siscabw-generate.py

      - name: Atualizar dados do pacote de teste
        id: generate
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/siscabw-generate.py             --inputs /tmp/siscabw-inputs             --repo /tmp/siscabw-candidate             | tee /tmp/siscabw-artifacts/generation-report.json
          mkdir -p /tmp/siscabw-candidate/assets/data /tmp/siscabw-candidate/assets/js
          cp /tmp/siscabw-candidate/contracts-summary.json /tmp/siscabw-candidate/assets/data/contracts-summary.json
          cp /tmp/siscabw-candidate/processos-data.js /tmp/siscabw-candidate/assets/js/processos-data.js

      - name: Validar origem dos Excel e sincronizar metadados
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python automation/finalize_update.py /tmp/siscabw-candidate /tmp/siscabw-inputs/input_manifest.json

      - name: Validar dados e coerência
        id: validate
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          cur = Path.cwd()
          cand = Path('/tmp/siscabw-candidate')
          inputs = Path('/tmp/siscabw-inputs')
          errors = []
          warnings = []

          prefixes = {
              'contracts-data.js': 'window.CABW_CONTRACTS_DATA = ',
              'processos-data.js': 'window.CABW_PROCESSOS_DATA = ',
              'rp-data.js': 'window.CABW_RP_DATA = ',
              'suprimento-data.js': 'window.CABW_SUPRIMENTO_DATA = ',
              'home-data.js': 'window.CABW_HOME_DATA = ',
          }

          def j(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def js(root, name):
              t = (root / name).read_text(encoding='utf-8')
              p = prefixes[name]
              if not t.startswith(p) or not t.rstrip().endswith(';'):
                  raise ValueError(f'Formato inválido: {name}')
              return json.loads(t[len(p):].rstrip()[:-1])

          manifest = j(inputs / 'input_manifest.json')
          if len(manifest.get('files', [])) != 10:
              errors.append(f"Esperadas 10 fontes obrigatórias; recebidas {len(manifest.get('files', []))}.")
          canonical = [x.get('canonicalName') for x in manifest.get('files', [])]
          if len(canonical) != len(set(canonical)):
              errors.append('Fontes canônicas duplicadas no Drive.')

          summary = j(cand / 'contracts-summary.json')
          contracts_obj = js(cand, 'contracts-data.js')
          contracts = contracts_obj.get('contracts', contracts_obj.get('data', []))
          if summary['total'] != len(contracts):
              errors.append('Total de contratos diverge da lista.')
          if summary['total'] != sum(summary['counts'].values()):
              errors.append('Soma das categorias diverge do total de contratos.')

          expected = {'administrativos': 0, 'finalisticos': 0, 'fms': 0}
          ids = []
          for item in contracts:
              cid = str(item.get('contrato', '')).strip()
              ids.append(cid)
              cage = str(item.get('cage', '')).strip()
              command = str(item.get('grandeComando', item.get('grandComando', ''))).strip()
              cat = 'fms' if cage == 'W2525' else ('administrativos' if command == 'CW' else 'finalisticos')
              expected[cat] += 1
              if item.get('categoria') != cat:
                  errors.append(f'Classificação inconsistente no contrato {cid}.')
                  break
          if not all(ids) or len(ids) != len(set(ids)):
              errors.append('Há contrato sem ID ou ID duplicado.')
          if expected != summary['counts']:
              errors.append(f"Categorias calculadas {expected} divergem de {summary['counts']}.")

          home = js(cand, 'home-data.js')
          if home['contratos']['quantidade'] != summary['total']:
              errors.append('Card de contratos da entrada diverge do resumo.')
          if home['contratos']['categorias'] != summary['counts']:
              errors.append('Categorias do card de entrada divergem do resumo.')

          proc = js(cand, 'processos-data.js')
          if proc['summary']['totalEscopo'] != len(proc.get('materials', [])) + len(proc.get('repairs', [])):
              errors.append('Resumo de processos diverge das listas.')

          rp = js(cand, 'rp-data.js')
          if rp['summary']['totalRegistros'] != len(rp.get('records', [])):
              errors.append('Resumo de RP diverge dos registros.')

          sf = js(cand, 'suprimento-data.js')
          metrics_after = {
              'contracts_total': int(summary['total']),
              'administrativos': int(summary['counts']['administrativos']),
              'finalisticos': int(summary['counts']['finalisticos']),
              'fms': int(summary['counts']['fms']),
              'processos': int(proc['summary']['totalEscopo']),
              'rp': int(rp['summary']['totalRegistros']),
              'sf': len(sf.get('orders', sf.get('records', []))),
          }

          try:
              old_summary = j(cur / 'contracts-summary.json')
              old_proc = js(cur, 'processos-data.js')
              old_rp = js(cur, 'rp-data.js')
              old_sf = js(cur, 'suprimento-data.js')
              metrics_before = {
                  'contracts_total': int(old_summary['total']),
                  'administrativos': int(old_summary['counts']['administrativos']),
                  'finalisticos': int(old_summary['counts']['finalisticos']),
                  'fms': int(old_summary['counts']['fms']),
                  'processos': int(old_proc['summary']['totalEscopo']),
                  'rp': int(old_rp['summary']['totalRegistros']),
                  'sf': len(old_sf.get('orders', old_sf.get('records', []))),
              }
              limits = {
                  'contracts_total': (0.10, 0.25),
                  'administrativos': (0.25, 0.50),
                  'finalisticos': (0.20, 0.40),
                  'fms': (0.10, 0.20),
                  'processos': (0.15, 0.30),
                  'rp': (0.25, 0.35),
                  'sf': (0.25, 0.50),
              }
              for key, before in metrics_before.items():
                  after = metrics_after[key]
                  if before <= 0:
                      continue
                  max_drop, max_growth = limits[key]
                  if (before - after) / before > max_drop:
                      errors.append(f'Queda anormal em {key}: {before} -> {after}.')
                  if (after - before) / before > max_growth:
                      errors.append(f'Crescimento anormal em {key}: {before} -> {after}.')
          except Exception as exc:
              warnings.append(f'Comparação com versão anterior não executada: {exc}')
              metrics_before = {}

          for name in (
              'contracts-data.js', 'credit-data.js', 'compatibilizacao-data.js',
              'processos-data.js', 'rp-data.js', 'suprimento-data.js',
              'home-data.js', 'credit-panel.js'
          ):
              result = subprocess.run(['node', '--check', str(cand / name)], capture_output=True, text=True)
              if result.returncode:
                  errors.append(f'Sintaxe JavaScript inválida em {name}: {result.stderr.strip()}')

          if 'generateAdidanciasReport' not in (cand / 'credit-panel.js').read_text(encoding='utf-8'):
              errors.append('Relatório das Adidâncias ausente de credit-panel.js.')
          if 'generateAdidanciasReport' not in (cand / 'credito.html').read_text(encoding='utf-8'):
              errors.append('Botão do relatório das Adidâncias ausente de credito.html.')

          mirrors = {
              'contracts-summary.json': 'assets/data/contracts-summary.json',
              'processos-data.js': 'assets/js/processos-data.js',
          }
          for source, mirror in mirrors.items():
              if (cand / source).read_bytes() != (cand / mirror).read_bytes():
                  errors.append(f'Espelho divergente: {source} / {mirror}.')

          report = {
              'status': 'ok' if not errors else 'failed',
              'errors': errors,
              'warnings': warnings,
              'ignoredExcelFiles': manifest.get('ignoredExcelFiles', []),
              'before': metrics_before,
              'after': metrics_after,
          }
          Path('/tmp/siscabw-artifacts/validation-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit(2)
          PY

      - name: Guardar diagnóstico
        if: always() && steps.schedule_gate.outputs.run_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: siscabw-teste-${{ github.run_number }}
          path: /tmp/siscabw-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Aplicar dados validados no ambiente de teste
        if: steps.schedule_gate.outputs.run_update == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='automation/'             --exclude='auth.js'             /tmp/siscabw-candidate/ ./

      - name: Publicar no main de cabwbi/teste
        id: publish
        if: steps.schedule_gate.outputs.run_update == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DATA_REF=$(python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data-update-status.json').read_text(encoding='utf-8'))
          print(d.get('geradoEm', 'sem-data'))
          PY
          )
          echo "data_ref=$DATA_REF" >> "$GITHUB_OUTPUT"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "result=no_change" >> "$GITHUB_OUTPUT"
            echo 'Nenhuma alteração encontrada: os dados eram os mesmos.'
            exit 0
          fi
          git add -A
          git commit -m "AUTO TESTE: atualiza dados SISCABW - $DATA_REF"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "result=updated" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notificar deploy confirmado no GitHub Mobile
        if: always() && steps.schedule_gate.outputs.run_update == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
          DATA_REF: ${{ steps.publish.outputs.data_ref }}
        with:
          script: |
            const result = process.env.PUBLISH_RESULT || '';
            const sha = process.env.COMMIT_SHA || '';
            const dataRef = process.env.DATA_REF || 'não disponível';
            const owner = context.repo.owner, repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let confirmed = false, deployedAt = '';
            let deploymentId = null;
            let statusCheckError = '';
            if (result === 'updated' && sha) {
              for (let attempt = 0; attempt < 30; attempt++) {
                let deployments;
                try {
                  deployments = await github.rest.repos.listDeployments({
                    owner, repo, sha, environment: 'github-pages', per_page: 10
                  });
                } catch (err) {
                  statusCheckError = String(err.message || err);
                  break;
                }
                for (const dep of deployments.data) {
                  let statuses;
                  try {
                    statuses = await github.rest.repos.listDeploymentStatuses({
                      owner, repo, deployment_id: dep.id, per_page: 20
                    });
                  } catch (err) {
                    statusCheckError = String(err.message || err);
                    break;
                  }
                  const success = statuses.data.find(s => s.state === 'success');
                  if (success) {
                    confirmed = true;
                    deployedAt = success.created_at;
                    deploymentId = dep.id;
                    break;
                  }
                }
                if (confirmed || statusCheckError) break;
                await sleep(20000);
              }
            }
            let title, body;
            if (confirmed) {
              title = '[SISCABW TESTE] Deploy confirmado';
              body = `@cabwbi\n\n**Atualização publicada e confirmada no GitHub Pages.**\n\n**DEPLOY_CONFIRMED_AT_UTC:** ${deployedAt}\n**DEPLOYMENT_ID:** ${deploymentId}\n**DATA_REF:** ${dataRef}\n**COMMIT_SHA:** ${sha}\n**RUN_URL:** ${runUrl}\nPainel: https://cabwbi.github.io/teste/`;
            } else if (result === 'updated') {
              title = '[SISCABW TESTE] Deploy ainda não confirmado';
              body = `@cabwbi\n\n**Dados gravados no GitHub, mas o deploy Pages não foi confirmado.**\n\nCommit: ${sha}\nErro de consulta: ${statusCheckError || 'nenhum deploy success encontrado no prazo'}\nRun: ${runUrl}`;
            } else if (result === 'no_change') {
              title = '[SISCABW TESTE] Sem alteração de dados';
              body = `@cabwbi\n\nNenhuma alteração de dados publicada.\nRun: ${runUrl}`;
            } else {
              title = '[SISCABW TESTE] Falha na atualização';
              body = `@cabwbi\n\nO fluxo não concluiu a gravação dos dados.\nRun: ${runUrl}`;
            }
            if (context.eventName === 'issues' && context.issue.number) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body
              });
              await github.rest.issues.update({
                owner, repo, issue_number: context.issue.number,
                state: 'closed', state_reason: 'completed'
              });
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, assignees: ['cabwbi']
              });
              await github.rest.issues.update({
                owner, repo, issue_number: created.data.number,
                state: 'closed', state_reason: 'completed'
              });
            }
